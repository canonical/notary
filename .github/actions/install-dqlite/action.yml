name: Install libdqlite
description: Install a libdqlite new enough for go-dqlite v3 (Ubuntu archive 1.16 is too old).

runs:
  using: composite
  steps:
    - name: Install libdqlite from the dqlite PPA
      shell: bash
      run: |
        sudo add-apt-repository -y --no-update ppa:dqlite/dev
        sudo apt-get -o Acquire::Retries=5 update --error-on=any
        sudo apt-get -o Acquire::Retries=5 install -y libdqlite1.18-dev
