name: Go Unit Tests

on:
  workflow_call:

jobs:  
  go-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - uses: ./.github/actions/install-dqlite

      - name: Unit tests
        run: go test -cover ./...
