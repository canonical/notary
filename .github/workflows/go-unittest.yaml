name: Go Unit Tests

on:
  workflow_call:

jobs:  
  go-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Install dqlite
        run: sudo apt-get update && sudo apt-get install -y libdqlite-dev

      - name: Unit tests
        run: go test -cover ./...
