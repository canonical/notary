name: PR Lint

on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  pull-requests: read

jobs:
  lint-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: canonical/identity-credentials-workflows/.github/workflows/lint-pr.yaml@3.1.1
