name: Snap Test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test-snap:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: snap
          path: snap-artifact
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y jq openssl shellcheck
      - name: Check service scripts
        run: shellcheck snap/hooks/* service/bin/notaryd-start snap/tests/lifecycle.sh
      - name: Test confined snap lifecycle
        run: bash snap/tests/lifecycle.sh snap-artifact/*.snap
      - name: Service diagnostics
        if: always()
        run: |
          sudo snap services notary || true
          sudo journalctl -u snap.notary.notaryd.service --no-pager -n 200 || true