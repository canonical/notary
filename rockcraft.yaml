name: notary
base: bare
build-base: ubuntu@24.04
adopt-info: notary-release-data
summary: A certificate management tool
description: |
  A certificate management tool.
license: Apache-2.0
platforms:
  amd64:
  arm64:

services:
  notary:
    command: notary start [ --config /etc/notary/config/config.yaml ]
    override: replace
    startup: enabled

parts:
  dqlite:
    source: https://github.com/canonical/dqlite
    source-type: git
    source-depth: 1
    source-tag: v1.17.0
    plugin: autotools
    autotools-configure-parameters:
      - --prefix=
      - --enable-build-raft
    stage-packages:
      - libuv1
      - libsqlite3-0
      - liblz4-1
    build-packages:
      - make
      - libuv1-dev
      - liblz4-dev
      - libsqlite3-dev
      - pkg-config
    organize:
      usr/lib/: lib/
    prime:
      - lib/libdqlite*so*
      - lib/libraft*so*
      - lib/*/libuv*so*
      - lib/*/liblz4*so*
      - lib/*/libsqlite3*so*

  notary:
    after: [dqlite]
    plugin: go
    source: .
    source-type: local
    build-snaps:
      - go/1.26/stable
      - node/20/stable
    build-environment:
      - GOTOOLCHAIN: local
      - CGO_CFLAGS: -I${CRAFT_STAGE}/include/ -I${CRAFT_STAGE}/usr/local/include/
      - CGO_LDFLAGS: -L${CRAFT_STAGE}/lib/ -L${CRAFT_STAGE}/usr/local/lib/
    override-build: |
      npm install --prefix ui
      npm run build --prefix ui
      craftctl default
    stage-packages:
      - ca-certificates_data
      - libc6_libs
      - base-files_lib

  notary-release-data:
    plugin: nil
    source: .
    override-build: |
      version="$(cat version/VERSION)"
      craftctl set version="$version"
