name: notary
base: core24
adopt-info: notary-release-data
summary: Notary is a certificate management tool.
license: Apache-2.0
description: |
  Notary is a simple, reliable, and secure certificate management tool.

  Use it to request, approve, and manage certificate requests for your services. 

grade: stable
confinement: strict

issues: https://github.com/canonical/notary/issues
source-code: https://github.com/canonical/notary

package-repositories:
  - type: apt
    ppa: dqlite/dev
    priority: always

apps:
  notary:
    command: bin/notary
    plugs:
      - network
      - network-bind
      - home
  notaryd:
    daemon: simple
    install-mode: disable
    command: bin/notaryd-start
    refresh-mode: endure
    plugs:
      - network
      - network-bind

parts:
  notary:
    plugin: go
    source: .
    source-type: local
    build-snaps:
      - go/1.26/stable
      - node/20/stable
    build-packages:
      - gcc
      - pkg-config
      - libdqlite1.18-dev
      - libsqlite3-dev
      - libuv1-dev
      - liblz4-dev
    stage-packages:
      - libdqlite1.18
      - libsqlite3-0
      - libuv1t64
      - liblz4-1
    build-environment:
      - GOTOOLCHAIN: local
      - CGO_ENABLED: "1"
    override-build: |
      npm install --prefix ui
      npm run build --prefix ui
      craftctl default

  notary-release-data:
    plugin: nil
    source: .
    override-build: |
      version="$(cat version/VERSION)"
      craftctl set version="$version"

  service-files:
    plugin: dump
    source: service
